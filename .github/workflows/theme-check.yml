name: Theme check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @shopify/cli@latest
      - name: Lint Liquid
        run: shopify theme check --fail-level error
